# Weekly data refresh.
#
# Re-runs the fetch scripts and, when a committed JSON file under data/ has
# changed, opens a pull request with the diff, so a new MHCLG table lands as
# something a person reads before it reaches the site. Each script refuses to
# write a shrunken or incomplete result and exits non-zero, which fails this
# run rather than committing an empty file.
#
# A pull request opened with GITHUB_TOKEN does not trigger other workflows, so
# validate the generated snapshot in this job before opening the request.
# Any later edit still needs CI on the exact head before merging.
name: Refresh data

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Council tax, England
        run: npm run data:council-tax

      - name: Spending summaries, AI DOGE
        run: npm run data:spending

      - name: Validate refreshed data and types
        run: |
          npm test
          npm run check

      - name: Build and check the refreshed site
        run: |
          npm run build
          npm run test:dist

      - name: Install Chromium
        run: |
          # The browser comes from Playwright's own host. Its system packages come from
          # Ubuntu's package servers, which could not be resolved on 11 November 2026 and
          # failed every run. They are tried for three minutes and are not required: the
          # runner image already holds Chrome's libraries, and a missing one fails the
          # browser tests that follow, loudly.
          npx playwright install chromium
          timeout --kill-after=10 180 npx playwright install-deps chromium || echo "::warning::Chromium system packages were not installed because the Ubuntu package servers could not be reached. The run continues with the packages the runner image holds."

      - name: Check user journeys and production headers
        run: |
          npm run test:e2e
          npm run test:csp

      - name: Open a pull request when data changed
        env:
          GH_TOKEN: ${{ github.token }}
        # Pure shell, no GitHub event interpolation, no injection risk.
        run: |
          # The generated stamp changes on every run; only a change in anything
          # else is a refresh worth reading.
          changed=""
          for file in $(git diff --name-only -- data/); do
            if git diff -U0 -- "$file" | grep -E '^[+-][^+-]' | grep -vqE '"generated":'; then
              changed="$changed $file"
            fi
          done
          if [ -z "$changed" ]; then
            echo "No data changed."
            git checkout -- data/
            exit 0
          fi
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          compare_url="https://github.com/tompickup23/ukcouncils/compare/main...${branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          # Keep attempting a PR for when the repo allows Actions to open them.
          # If create is refused, the pushed branch and compare URL are enough
          # for a person to review; do not fail the job for want of that setting.
          if gh pr create --base main --head "$branch" \
            --title "Refresh data $(date -u +%Y-%m-%d)" \
            --body "The weekly refresh found changed data in:$changed. This generated snapshot passed unit, type, build, browser and production security header checks in the refresh job. Read the diff before merging. Any subsequent edit needs validation of the exact head to be merged."; then
            echo "Pull request opened for ${branch}."
          else
            {
              echo "## Refresh data branch pushed"
              echo
              echo "\`gh pr create\` was refused (often because the repository setting"
              echo "\"Allow GitHub Actions to create and approve pull requests\" is off)."
              echo "The validated snapshot is on the branch below."
              echo
              echo "- Branch: \`${branch}\`"
              echo "- Compare: ${compare_url}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "PR create refused; branch ${branch} left at ${compare_url}"
            exit 0
          fi
