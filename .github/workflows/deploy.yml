# Deploys main to Cloudflare Pages project "ukcouncils" on every push.
#
# The same gates as ci.yml run first, in the same order, so nothing reaches
# production that a pull request would have failed. The one intended
# difference: this build sets BUILD_OG, because the share cards ship from here
# and a pull request does not need the slow Satori pass. The pattern is
# lancashireai's deploy.yml: wrangler direct upload with the token from
# repository secrets.
#
# The token is the repository secret CLOUDFARE_API_TOKEN (no L after the F),
# a deliberate spelling kept as saved on 4 November 2026. The account ID is
# not a secret and is written below, as in CLAUDE.md.
#
# Without CLOUDFARE_API_TOKEN, or on a manual run from any ref other than
# refs/heads/main, the job stops after the gates: the job summary says why,
# the publish and IndexNow steps are skipped, and the run ends green. There is
# no fallback route. See docs/DEPLOY.md.
#
# The token reaches only the step that tests for it and the step that
# publishes; npm ci and the test runs never see it.
#
# BUILD_OG is set through an env block, never inline on the run line. Pure
# shell, no GitHub event interpolation, no injection risk.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Gates, in ci.yml order: validate, then build.

      - name: Read pinned RA cache hashes
        id: ra-sources
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const sources = JSON.parse(readFileSync('data/budget/sources.json', 'utf8'));
          const hashes = ['raPart1', 'raPart2', 'raGrants'].map(key => sources[key].sha256);
          if (hashes.some(hash => !/^[a-f0-9]{64}$/.test(hash))) throw new Error('Invalid pinned RA hash');
          console.log(`hashes=${hashes.join('-')}`);
          NODE

      - name: Restore pinned RA workbooks
        uses: actions/cache@v4
        with:
          path: |
            data/raw/RA_2026-27_data_Part_1.ods
            data/raw/RA_2026-27_data_Part_2.ods
            data/raw/SG_2026-27.ods
          key: ${{ runner.os }}-ra-${{ steps.ra-sources.outputs.hashes }}

      - name: Rehash and reproduce the pinned RA edition
        run: |
          node scripts/import-ra-budget.mjs
          git diff --exit-code -- data/budget/ra-2026-27.json

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          BUILD_OG: "1"
        run: npm run build

      - name: Check the built tree
        run: npm run test:dist

      - name: Verify every rendered panel claim
        run: npx vitest run tests/reorganisation-held.test.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests, mobile and desktop
        run: npm run test:e2e

      - name: Security headers against the built tree
        run: npm run test:csp

      - name: Keep the report when a spec failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Deploy, only from main and only with the token secret present.

      - name: Check the deploy secret and branch
        id: secrets
        env:
          CLOUDFARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "Deploy skipped: this run is on ${DEPLOY_REF}, not refs/heads/main. Gates passed; nothing was published. See docs/DEPLOY.md." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::Run is on ${DEPLOY_REF}, not refs/heads/main"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFARE_API_TOKEN" ]; then
            echo "Deploy skipped: repository secret missing: CLOUDFARE_API_TOKEN. Gates passed; nothing was published. See docs/DEPLOY.md." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::Repository secret missing: CLOUDFARE_API_TOKEN"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish dist/ to Cloudflare Pages
        id: publish
        if: steps.secrets.outputs.ready == 'true'
        env:
          # The repository secret is spelt CLOUDFARE_API_TOKEN (no L after the F), as saved on
          # 4 November 2026; wrangler still reads the variable as CLOUDFLARE_API_TOKEN.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 35e8f9e8edb5487b97309d107331f7f5
        run: npx --yes wrangler@4 pages deploy dist --project-name ukcouncils --branch main --commit-hash "$GITHUB_SHA"

      # IndexNow, only after a publish that succeeded. The manifest of page
      # hashes from the last submitted build lives in the Actions cache; with
      # none (first run, or evicted after seven idle days) every sitemap URL is
      # submitted, capped at the batch limit. A refused submission is reported
      # but does not turn a good deploy red, and its manifest is not saved, so
      # the same URLs are offered again next time.

      - name: Restore the last submitted IndexNow manifest
        if: steps.publish.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/previous.json
          key: indexnow-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-manifest-

      - name: Tell IndexNow which pages changed
        id: indexnow
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .indexnow
          if node scripts/indexnow.mjs --changed --dist dist --previous .indexnow/previous.json --manifest .indexnow/next.json | tee .indexnow/log.txt; then
            echo "IndexNow: $(tail -n 1 .indexnow/log.txt)" >> "$GITHUB_STEP_SUMMARY"
            cp .indexnow/next.json .indexnow/previous.json
          else
            echo "IndexNow failed after a successful deploy: $(tail -n 1 .indexnow/log.txt)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=IndexNow::Submission failed; the deploy stands"
            exit 1
          fi

      - name: Save the IndexNow manifest
        if: steps.indexnow.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .indexnow/previous.json
          key: indexnow-manifest-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Note the skipped IndexNow step
        if: steps.secrets.outputs.ready != 'true'
        run: |
          echo "IndexNow skipped: the deploy was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=IndexNow skipped::The deploy was skipped"
