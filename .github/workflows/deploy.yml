# Deploys main to Cloudflare Pages project "ukcouncils" on every push.
#
# The same gates as ci.yml run first, in the same order, so nothing reaches
# production that a pull request would have failed. The one intended
# difference: this build sets BUILD_OG, because the share cards ship from here
# and a pull request does not need the slow Satori pass. The pattern is
# lancashireai's deploy.yml: wrangler direct upload with the token from
# repository secrets.
#
# Without CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID the job stops after the
# gates: the job summary names the missing secret, the publish and IndexNow
# steps are skipped, and the run ends green. There is no fallback route. See
# docs/DEPLOY.md.
#
# The secrets reach only the step that tests for them and the step that
# publishes; npm ci and the test runs never see them.
#
# BUILD_OG is set through an env block, never inline on the run line. Pure
# shell, no GitHub event interpolation, no injection risk.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Gates, in ci.yml order: validate, then build.

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          BUILD_OG: "1"
        run: npm run build

      - name: Check the built tree
        run: npm run test:dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests, mobile and desktop
        run: npm run test:e2e

      - name: Security headers against the built tree
        run: npm run test:csp

      - name: Keep the report when a spec failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Deploy, only with both secrets present.

      - name: Check the deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          missing="${missing# }"
          if [ -n "$missing" ]; then
            echo "Deploy skipped: repository secret missing: ${missing}. Gates passed; nothing was published. See docs/DEPLOY.md." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::Repository secret missing: ${missing}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish dist/ to Cloudflare Pages
        id: publish
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name ukcouncils --branch main --commit-hash "$GITHUB_SHA"

      # IndexNow, only after a publish that succeeded. The manifest of page
      # hashes from the last submitted build lives in the Actions cache; with
      # none (first run, or evicted after seven idle days) every sitemap URL is
      # submitted, capped at the batch limit. A refused submission is reported
      # but does not turn a good deploy red, and its manifest is not saved, so
      # the same URLs are offered again next time.

      - name: Restore the last submitted IndexNow manifest
        if: steps.publish.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: .indexnow/previous.json
          key: indexnow-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-manifest-

      - name: Tell IndexNow which pages changed
        id: indexnow
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p .indexnow
          if node scripts/indexnow.mjs --changed --dist dist --previous .indexnow/previous.json --manifest .indexnow/next.json | tee .indexnow/log.txt; then
            echo "IndexNow: $(tail -n 1 .indexnow/log.txt)" >> "$GITHUB_STEP_SUMMARY"
            cp .indexnow/next.json .indexnow/previous.json
          else
            echo "IndexNow failed after a successful deploy: $(tail -n 1 .indexnow/log.txt)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=IndexNow::Submission failed; the deploy stands"
            exit 1
          fi

      - name: Save the IndexNow manifest
        if: steps.indexnow.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .indexnow/previous.json
          key: indexnow-manifest-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Note the skipped IndexNow step
        if: steps.secrets.outputs.ready != 'true'
        run: |
          echo "IndexNow skipped: the deploy was skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=IndexNow skipped::The deploy was skipped"
